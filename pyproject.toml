[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vol-realizada-b3"
version = "0.1.0"
description = "Volatilidade realizada e jumps em acoes da B3 com dados intradiarios."
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2,<3.0",
  "numpy>=1.26,<3.0",
  "scipy>=1.12,<2.0",
  "statsmodels>=0.14,<1.0",
  "arch>=7.0,<9.0",
  "yfinance>=0.2.54,<1.0",
  "matplotlib>=3.8,<4.0",
  "python-pptx>=1.0,<2.0",
  "PyYAML>=6.0,<7.0",
  "openpyxl>=3.1,<4.0",
  "tqdm>=4.66,<5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --basetemp=outputs/test_tmp"
